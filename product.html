<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>耀鸥服装 - 商品详情</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-container"></div>
    <div id="notice-container"></div>

    <div class="product-detail" id="product-detail"></div>
    <div id="empty-state" style="display:none; text-align:center; padding:80px 20px;">
        <p style="font-size:80px; margin-bottom:20px;">👕</p>
        <p style="font-size:20px; color:#666; margin-bottom:20px;">未找到该商品</p>
        <button onclick="window.location.href='index.html'" style="padding:12px 30px; background:#4caf50; color:white; border:none; border-radius:22px; font-size:15px; cursor:pointer;">返回首页</button>
    </div>

    <div id="footer-container"></div>

    <script src="app.js"></script>
    <script>
        document.getElementById('header-container').innerHTML = renderHeader('detail');
        document.getElementById('notice-container').innerHTML = renderNoticeBar();
        document.getElementById('footer-container').innerHTML = renderFooter();
        initPage('detail');

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const product = Storage.getProducts().find(p => p.id === id);

        if (!product) {
            document.getElementById('product-detail').style.display = 'none';
            document.getElementById('empty-state').style.display = 'block';
        } else {
            renderDetail();
        }

        function renderDetail() {
            const colorDots = product.colors.map((c, i) => {
                const bg = getColorValue(c);
                const borderColor = bg === '#ffffff' ? '#e0e0e0' : 'transparent';
                return `<span class="color-option ${i === 0 ? 'selected' : ''}" data-color="${c}" 
                        style="background:${bg}; border:3px solid ${i === 0 ? '#1a7a4c' : borderColor};"
                        title="${c}"></span>`;
            }).join('');

            const sizeBtns = product.sizes.map((s, i) =>
                `<button class="size-option ${i === 0 ? 'selected' : ''}" data-size="${s}">${s}</button>`
            ).join('');

            const categoryBig = product.category === 'men' ? '男装' : '女装';

            // 默认精美占位图
            const defaultBig = product.category === 'men'
                ? `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="width:65%;height:65%;">
                    <defs>
                      <linearGradient id="menBg2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#e8f5e9"/>
                        <stop offset="100%" stop-color="#c8e6c9"/>
                      </linearGradient>
                      <linearGradient id="menShirt2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#1a7a4c"/>
                        <stop offset="100%" stop-color="#2e7d32"/>
                      </linearGradient>
                    </defs>
                    <rect width="200" height="240" fill="url(#menBg2)"/>
                    <path d="M 60,60 L 50,55 L 40,90 L 60,100 L 60,200 L 140,200 L 140,100 L 160,90 L 150,55 L 140,60 L 120,45 Q 100,60 80,45 Z" fill="url(#menShirt2)"/>
                    <circle cx="100" cy="60" r="8" fill="#0d4b2a"/>
                    <circle cx="100" cy="95" r="3" fill="#c8e6c9"/>
                    <circle cx="100" cy="125" r="3" fill="#c8e6c9"/>
                    <circle cx="100" cy="155" r="3" fill="#c8e6c9"/>
                    <path d="M 70,180 L 70,215 L 130,215 L 130,180" fill="none" stroke="#0d4b2a" stroke-width="2"/>
                    <text x="100" y="230" font-size="14" fill="#1a7a4c" text-anchor="middle" font-family="Microsoft YaHei">男装</text>
                  </svg>`
                : `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="width:65%;height:65%;">
                    <defs>
                      <linearGradient id="womenBg2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#fce4ec"/>
                        <stop offset="100%" stop-color="#f8bbd0"/>
                      </linearGradient>
                      <linearGradient id="womenDress2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#e91e63"/>
                        <stop offset="100%" stop-color="#c2185b"/>
                      </linearGradient>
                    </defs>
                    <rect width="200" height="240" fill="url(#womenBg2)"/>
                    <path d="M 70,55 L 60,50 L 50,80 L 75,95 L 70,130 L 55,210 L 145,210 L 130,130 L 125,95 L 150,80 L 140,50 L 130,55 Q 120,48 100,55 Q 80,48 70,55 Z" fill="url(#womenDress2)"/>
                    <circle cx="85" cy="85" r="4" fill="#fff3e0"/>
                    <circle cx="115" cy="85" r="4" fill="#fff3e0"/>
                    <path d="M 75,105 Q 100,100 125,105" stroke="#fff3e0" stroke-width="2" fill="none"/>
                    <path d="M 70,135 L 130,135" stroke="#fff3e0" stroke-width="1.5" stroke-dasharray="5,3"/>
                    <circle cx="100" cy="155" r="4" fill="#fff3e0"/>
                    <text x="100" y="230" font-size="14" fill="#c2185b" text-anchor="middle" font-family="Microsoft YaHei">女装</text>
                  </svg>`;

            document.getElementById('product-detail').innerHTML = `
                <div style="max-width:1100px; margin:25px auto; padding:0 20px;">
                    <div style="margin-bottom:20px; color:#666; font-size:14px;">
                        <a href="index.html" style="color:#4caf50;">🏠 首页</a> / 
                        <a href="${product.category === 'men' ? 'men.html' : 'women.html'}" style="color:#4caf50;">${categoryBig}</a> / 
                        <span style="color:#333;">${product.name}</span>
                    </div>

                    <div style="background:white; border-radius:12px; padding:30px; display:grid; grid-template-columns:1fr 1fr; gap:40px; border:1px solid #e0e0e0;">

                        <!-- 左侧：图片区（固定尺寸） -->
                        <div style="display:flex; flex-direction:column; align-items:center;">
                            <!-- 主图：固定400x400尺寸 -->
                            <div style="width:400px; height:400px; max-width:100%; background:#f5f5f5; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative; border:1px solid #e0e0e0;">
                                ${product.image
                                    ? `<img src="${product.image}" alt="${product.name}" style="width:400px; height:400px; object-fit:cover; display:block;">`
                                    : defaultBig}
                            </div>

                            <!-- 特色标签 -->
                            <div style="display:flex; gap:10px; margin-top:15px; width:100%;">
                                <div style="flex:1; background:#f1f8f4; border-radius:8px; padding:12px; text-align:center; border:1px solid #c8e6c9;">
                                    <div style="font-size:24px;">✅</div>
                                    <div style="color:#1a7a4c; font-size:13px; font-weight:bold; margin-top:5px;">品质保证</div>
                                </div>
                                <div style="flex:1; background:#f1f8f4; border-radius:8px; padding:12px; text-align:center; border:1px solid #c8e6c9;">
                                    <div style="font-size:24px;">🔄</div>
                                    <div style="color:#1a7a4c; font-size:13px; font-weight:bold; margin-top:5px;">包退包换</div>
                                </div>
                                <div style="flex:1; background:#f1f8f4; border-radius:8px; padding:12px; text-align:center; border:1px solid #c8e6c9;">
                                    <div style="font-size:24px;">🚚</div>
                                    <div style="color:#1a7a4c; font-size:13px; font-weight:bold; margin-top:5px;">款式丰富</div>
                                </div>
                            </div>
                        </div>

                        <!-- 右侧：商品信息 -->
                        <div>
                            <div style="display:inline-block; background:#1a7a4c; color:white; padding:5px 15px; border-radius:15px; font-size:12px; margin-bottom:10px; font-weight:bold;">
                            🏭 ${categoryBig}
                        </div>
                        <h2 style="color:#333; margin-bottom:8px; font-size:22px; font-weight:bold;">${product.name}</h2>
                        <div style="color:#666; font-size:13px; margin-bottom:20px;">款号: <span style="color:#4caf50; font-weight:bold;">${product.code}</span> | 款式: ${product.style}</div>

                        <!-- 价格区 -->
                        <div style="background:#f1f8f4; padding:20px; border-radius:10px; margin-bottom:25px; border-left:4px solid #4caf50;">
                            <div style="color:#1a7a4c; font-size:14px; margin-bottom:5px;">工厂直销价</div>
                            <div style="font-size:36px; color:#1a7a4c; font-weight:bold;">
                                <span style="font-size:20px;">¥</span>${product.price}
                            </div>
                            <div style="color:#999; font-size:13px; text-decoration:line-through; margin-top:5px;">原价 ¥${Math.round(product.price * 1.5)}</div>
                        </div>

                        <!-- 颜色选择 -->
                        <div style="margin-bottom:20px;">
                            <div style="font-size:14px; color:#333; margin-bottom:10px; font-weight:bold;">颜色：</div>
                            <div style="display:flex; gap:15px; flex-wrap:wrap;">${colorDots}</div>
                            <div id="selected-color-name" style="margin-top:8px; font-size:13px; color:#1a7a4c; font-weight:bold;">已选：${product.colors[0]}</div>
                        </div>

                        <!-- 尺码选择 -->
                        <div style="margin-bottom:20px;">
                            <div style="font-size:14px; color:#333; margin-bottom:10px; font-weight:bold;">尺码：</div>
                            <div style="display:flex; gap:10px; flex-wrap:wrap;">${sizeBtns}</div>
                        </div>

                        <!-- 数量选择 -->
                        <div style="margin-bottom:25px;">
                            <div style="font-size:14px; color:#333; margin-bottom:10px; font-weight:bold;">数量：</div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <button id="qty-minus" style="width:36px; height:36px; border:1px solid #ddd; background:white; border-radius:8px; font-size:18px; cursor:pointer; font-weight:bold; color:#333;">−</button>
                                <input type="number" id="qty" value="1" min="1" max="${product.quantity}" style="width:80px; height:36px; text-align:center; border:1px solid #ddd; border-radius:8px; font-size:16px; color:#333;">
                                <button id="qty-plus" style="width:36px; height:36px; border:1px solid #ddd; background:white; border-radius:8px; font-size:18px; cursor:pointer; font-weight:bold; color:#333;">+</button>
                                <span style="color:#999; font-size:13px; margin-left:10px;">库存: ${product.quantity}件</span>
                            </div>
                        </div>

                        <!-- 描述 -->
                        <div style="padding:15px; background:#f9f9f9; border-radius:8px; margin-bottom:25px; color:#666; font-size:14px; line-height:1.8;">
                            <strong style="color:#1a7a4c;">📦 商品描述：</strong>${product.description || '优质面料，舒适透气，时尚百搭，适合各种场合穿着。'}
                        </div>

                        <!-- 按钮 -->
                        <div style="display:flex; gap:12px;">
                            <button id="btn-cart" style="flex:1; padding:14px; background:#1a7a4c; color:white; border:none; border-radius:25px; font-size:15px; font-weight:bold; cursor:pointer; letter-spacing:2px;">🛒 加入购物车</button>
                            <button id="btn-buy" style="flex:1; padding:14px; background:#4caf50; color:white; border:none; border-radius:25px; font-size:15px; font-weight:bold; cursor:pointer; letter-spacing:2px;">💬 联系购买</button>
                        </div>
                    </div>
                </div>
            `;

            // 事件绑定
            let selectedColor = product.colors[0];
            let selectedSize = product.sizes[0];
            const shop = Storage.getShopInfo();

            // 颜色选择
            document.querySelectorAll('.color-option').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(c => {
                        c.classList.remove('selected');
                        const bgColor = getColorValue(c.dataset.color);
                        c.style.border = '3px solid ' + (bgColor === '#ffffff' ? '#e0e0e0' : 'transparent');
                    });
                    this.classList.add('selected');
                    this.style.border = '3px solid #1a7a4c';
                    selectedColor = this.dataset.color;
                    document.getElementById('selected-color-name').textContent = '已选：' + selectedColor;
                });
            });

            // 尺码选择
            document.querySelectorAll('.size-option').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.size-option').forEach(s => {
                        s.classList.remove('selected');
                        s.style.background = 'white';
                        s.style.color = '#333';
                        s.style.border = '1px solid #ddd';
                    });
                    this.classList.add('selected');
                    this.style.background = '#1a7a4c';
                    this.style.color = 'white';
                    this.style.border = '1px solid #1a7a4c';
                    selectedSize = this.dataset.size;
                });
            });

            // 初始化第一个尺码按钮样式
            const firstSize = document.querySelector('.size-option.selected');
            if (firstSize) {
                firstSize.style.background = '#1a7a4c';
                firstSize.style.color = 'white';
                firstSize.style.border = '1px solid #1a7a4c';
            }

            // 数量加减
            const qtyInput = document.getElementById('qty');
            document.getElementById('qty-minus').addEventListener('click', () => {
                const val = parseInt(qtyInput.value);
                if (val > 1) qtyInput.value = val - 1;
            });
            document.getElementById('qty-plus').addEventListener('click', () => {
                const val = parseInt(qtyInput.value);
                if (val < product.quantity) qtyInput.value = val + 1;
            });

            // 加入购物车
            document.getElementById('btn-cart').addEventListener('click', () => {
                const qty = parseInt(qtyInput.value);
                Cart.add(product, selectedSize, selectedColor, qty);
                showToast('✓ 已加入购物车');
            });

            // 联系购买
            document.getElementById('btn-buy').addEventListener('click', () => {
                alert('欢迎选购！\n\n请添加微信进行付款：\n📱 微信号: ' + shop.wechat + '\n📞 电话: ' + shop.phone + '\n📍 地址: ' + shop.address);
            });
        }
    </script>
</body>
</html>
